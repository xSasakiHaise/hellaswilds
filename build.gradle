plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'java'
}

group = mod_group_id
version = mod_version
archivesBaseName = mod_id

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8) // Forge 1.16.5 requires Java 8
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('libs/hellascontrol-2.1.0.jar')
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources') {
    inputs.properties(
            'modId': mod_id,
            'modVersion': mod_version,
            'modName': mod_name,
            'modAuthors': mod_authors,
            'modDescription': mod_description,
            'minecraftVersionRange': minecraft_version_range,
            'forgeVersionRange': forge_version_range,
            'loaderVersionRange': loader_version_range
    )

    filesMatching('META-INF/mods.toml') {
        expand(
                modId: mod_id,
                modVersion: mod_version,
                modName: mod_name,
                modAuthors: mod_authors,
                modDescription: mod_description,
                minecraftVersionRange: minecraft_version_range,
                forgeVersionRange: forge_version_range,
                loaderVersionRange: loader_version_range
        )
    }
}

jar {
    manifest {
        attributes(
                "Specification-Title": mod_name,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": mod_name,
                "Implementation-Version": mod_version,
                "Implementation-Vendor": mod_authors
        )
    }
}
