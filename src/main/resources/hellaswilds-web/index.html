<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HellasWilds Spawn Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>HellasWilds Spawn Editor</h1>
    <section id="zone" class="card"></section>
    <section id="status" class="card"></section>
    <div class="actions">
      <button id="add">Add Rule</button>
      <button id="save">Save Changes</button>
    </div>
    <table id="rules">
      <thead>
        <tr>
          <th>Species</th>
          <th>Level Min</th>
          <th>Level Max</th>
          <th>Weight</th>
          <th>Time</th>
          <th>Weather</th>
          <th>Form</th>
          <th>Size</th>
          <th>Ribbons</th>
          <th>Alpha</th>
          <th>Soft</th>
          <th>Cooldown</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
